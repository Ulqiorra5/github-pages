<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивная фотогалерея</title>
  <style>
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    img {
      width: 200px;
      height: auto;
      border: 3px solid transparent;
      outline: none;
    }
    img:focus,
    img:hover {
      border-color: #00f;
    }
  </style>
</head>
<body onload="initGallery()">
  <main>
    <h1>Интерактивная фотогалерея</h1>
    <div class="gallery" id="gallery">
      <img src="https://placekitten.com/300/200" alt="Милый котенок" />
      <img src="https://placebear.com/300/200" alt="Медведь в лесу" />
      <img src="https://picsum.photos/id/237/300/200" alt="Пейзаж с деревом" />
      <img src="https://picsum.photos/id/1015/300/200" alt="Горная река" />
      <img src="https://picsum.photos/id/1025/300/200" alt="Пес на пляже" />
      <img src="https://picsum.photos/id/1062/300/200" alt="Современное здание" />
    </div>
  </main>

  <script>
    function initGallery() {
      const images = document.querySelectorAll('.gallery img');
      console.log('Сайт загружен. Обнаружено изображений: ' + images.length);

      for (let i = 0; i < images.length; i++) {
        const img = images[i];
        img.setAttribute('tabindex', '0');

        img.addEventListener('mouseover', () => {
          console.log('Навели мышь на изображение: ' + img.alt);
        });

        img.addEventListener('mouseleave', () => {
          console.log('Увели мышь с изображения: ' + img.alt);
        });

        img.addEventListener('focus', () => {
          console.log('Фокус на изображении: ' + img.alt);
        });

        img.addEventListener('blur', () => {
          console.log('Потеря фокуса изображения: ' + img.alt);
        });
      }
    }
  </script>
</body>
</html>
